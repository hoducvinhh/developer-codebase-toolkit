[project]
name = "dependency-audit"
version = "0.1.0"
description = "Audit dependencies, vulnerabilities, outdated packages, duplicates, and license compliance."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "toolkit_common",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "packaging>=23.0",
]

[project.scripts]
da = "dependency_audit.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
