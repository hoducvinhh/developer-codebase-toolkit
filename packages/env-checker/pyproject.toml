[project]
name = "env-checker"
version = "0.1.0"
description = "Validate environment variables, templates, schemas, secrets, and code references."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "toolkit_common",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
envcheck = "env_checker.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
